<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0e131b">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Wetter</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <!-- Schriften und Bibliotheken liegen lokal (vendor/): keine Verbindungen zu Google oder CDNs -->
  <link rel="stylesheet" href="vendor/fonts/fonts.css">
  <link rel="stylesheet" href="vendor/leaflet.css">
  <link rel="stylesheet" href="mobile.css">
</head>
<body>
  <main id="views">

    <!-- ============ Wetter ============ -->
    <section id="view-wetter" class="view active" aria-label="Wetter">
      <div class="scroll" id="wetterScroll">
        <div id="pullHint" class="pull-hint" aria-hidden="true">Zum Aktualisieren loslassen</div>
        <div role="tablist" aria-label="Ort wählen" class="loc-tabs" id="locTabs"></div>
        <div id="wetterBody"><div class="placeholder">Lädt …</div></div>
      </div>
    </section>

    <!-- ============ Favoriten (eigene Ansicht, über Reiter erreichbar) ============ -->
    <section id="view-favs" class="view" aria-label="Favoriten">
      <div class="scroll">
        <div role="tablist" aria-label="Ort wählen" class="loc-tabs" id="locTabs2"></div>
        <div class="row-between">
          <h1 class="h1">Meine Orte</h1>
          <button class="pill-btn" id="favEdit">Bearbeiten</button>
        </div>
        <label class="search">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
          <input id="favSearch" type="search" placeholder="Ort, PLZ oder Adresse hinzufügen …" aria-label="Ort hinzufügen" autocomplete="off" enterkeyhint="search">
        </label>
        <ul id="favResults" class="results"></ul>
        <div id="favList" class="fav-list"></div>
        <p class="hint">Tippen öffnet die volle Übersicht für den Ort. Unter „Bearbeiten“ lassen sich Orte sortieren und entfernen.</p>
      </div>
    </section>

    <!-- ============ Karte ============ -->
    <section id="view-karte" class="view" aria-label="Karte">
      <div class="map-wrap">
        <div id="map"></div>
        <div class="mc mc-time">
          <div id="mcTime">--:--</div>
          <div id="mcDate"></div>
          <span id="frameBadge" class="badge"></span>
          <div id="mcSrc"></div>
        </div>
        <div class="map-fabs">
          <button class="fab" id="btnLayers" aria-label="Ebenen wählen"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l9 5-9 5-9-5z"/><path d="M3 13l9 5 9-5"/></svg></button>
          <button class="fab" id="btnLocate" aria-label="Auf meinen Ort zentrieren"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg></button>
        </div>
        <div class="mc mc-legend" id="mcLegend"></div>
        <div class="mc mc-bar">
          <div class="mc-tabs" id="rangeTabs" role="tablist" aria-label="Zeitraum"></div>
          <div class="mc-row">
            <button id="btnPlay" class="play" aria-label="Abspielen">▶</button>
            <button id="btnPrev" class="mc-btn" aria-label="Zurück">‹</button>
            <input type="range" id="timeSlider" min="0" max="0" value="0" aria-label="Zeitpunkt">
            <button id="btnNext" class="mc-btn" aria-label="Weiter">›</button>
            <span id="frameLoad"></span>
          </div>
        </div>
      </div>
      <!-- Ebenen-Auswahl -->
      <div class="sheet-backdrop" id="layerBackdrop" hidden></div>
      <section class="sheet" id="layerSheet" role="dialog" aria-label="Kartenebenen" hidden>
        <div class="grab"></div>
        <div class="row-between"><h2 class="h1">Ebenen</h2><button class="icon-round" id="layerClose" aria-label="Schließen">✕</button></div>
        <label class="layer-row">
          <span class="layer-ico">★</span><span class="layer-txt"><b>Meine Orte</b><small>Standort, Zuhause, Favoriten</small></span>
          <input type="checkbox" id="chkMine">
        </label>
        <div id="layerButtons" class="layer-list"></div>
        <label class="layer-row cloud-op">
          <span class="layer-ico">☁</span>
          <span class="layer-txt"><b>Wolken-Deckkraft <span id="cloudOpVal"></span></b>
            <input type="range" id="cloudOp" min="20" max="100" step="5" aria-label="Wolken-Deckkraft in Prozent"></span>
        </label>
        <p class="hint">Temperatur, Wind und Sonneneinstrahlung blenden die Wolken automatisch aus.</p>
        <div id="modeTitle" class="hint"></div>
      </section>
    </section>

    <!-- ============ PV & Luft ============ -->
    <section id="view-pv" class="view" aria-label="PV und Luft">
      <div class="scroll" id="pvBody"><div class="placeholder">Lädt …</div></div>
    </section>

    <!-- ============ Mehr / Einstellungen ============ -->
    <section id="view-mehr" class="view" aria-label="Einstellungen">
      <div class="scroll" id="mehrBody"></div>
    </section>
  </main>

  <nav class="tabbar" aria-label="Hauptnavigation" id="tabbar">
    <button data-view="wetter" class="on" aria-current="page"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M17.5 19H8a5 5 0 1 1 .9-9.9A6 6 0 0 1 20 11.5a3.75 3.75 0 0 1-2.5 7.5z"/></svg>Wetter</button>
    <button data-view="karte"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4L3 6v14l6-2 6 2 6-2V4l-6 2z"/><path d="M9 4v14M15 6v14"/></svg>Karte</button>
    <button data-view="pv"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2"/></svg>PV &amp; Luft</button>
    <button data-view="mehr"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg>Mehr</button>
  </nav>

  <!-- map.js prüft diesen Dialog bei Tastenkürzeln -->
  <dialog id="settings"></dialog>
  <div id="toast" class="toast" hidden></div>

  <script src="vendor/leaflet.js"></script>
  <script src="vendor/proj4.js"></script>
  <script src="mobile.js"></script>
  <script src="../map.js"></script>
  <script src="mobile-map.js"></script>
</body>
</html>
